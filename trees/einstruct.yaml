- id: ab_segregation
  title: Two colours that vanish on contact sort themselves into regions
  hook: 200,000 particles. Half one colour, half the other. When two of different colours meet, both vanish.
    That is the whole rule. By the end, regions. Nobody drew them.
  evidence: results/film/renders/ab_d2-ep05/preview.png
  hero: true
- id: ab_control
  title: Shuffle the colours and the regions never come
  hook: Same particles, same rule, but every few steps the colours are shuffled over the places. No regions
    form, and by the end nine times fewer particles are left.
  evidence: results/film/renders/ab_d2_stir/preview.png
  hero: false
- id: row_invariance
  title: A row does not know which way is up
  hook: Rotate the cloud, mirror it, renumber it. The bars do not move. Zoom it, and every bar grows.
  evidence: results/film/anims/row/preview.png
  hero: false
- id: dimension_as_arrival
  title: A dimension is how fast neighbours arrive
  hook: Double the houses and the walk grows by 2 on a street, by root 2 in a town, by cube root 2 in
    a tower.
  evidence: results/film/anims/walk/preview.png
  hero: false
- id: droplet_closure
  title: Newton's law without positions, and where it gives out
  hook: Keep no positions at all, only a few numbers for every pair of particles, and Newton's law still
    moves them for about one unit of time. Keep only the pairs within reach, and the error walks in from
    the edge of your reach and ends the run five times sooner.
  evidence: results/film/anims/front/preview.png
  hero: false
- id: short_list_reach
  title: A short list misses neighbours and never invents one
  hook: Give every particle of a fluid nothing but its 48 nearest distances, and its pressure comes out
    the same as from the positions, to rounding. Squeeze the fluid until more than 48 neighbours crowd
    into the range a particle feels, and the answer comes out low, never high.
  evidence: results/exp32_fluid/fig1_eos.png
  hero: false

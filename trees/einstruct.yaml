name: einstruct
path: /home/manuel/weichseltree/einstruct
remote: https://github.com/weichseltree/einstruct.git
question: Throw away the axes. Describe a cloud of points only by the distances between them. Does that
  buy you anything a coordinate method cannot?
status: active
stage: planted
gpu: torch
phenomena:
- id: ab_segregation
  title: Two colours that vanish on contact sort themselves into regions
  hook: 200,000 particles. Half one colour, half the other. When two of different colours meet, both vanish.
    That is the whole rule. By the end, regions. Nobody drew them.
  evidence: results/film/renders/ab_d2-ep05/preview.png
  hero: true
- id: row_invariance
  title: A row does not know which way is up
  hook: Rotate the cloud, mirror it, renumber it. The bars do not move. Zoom it, and every bar grows.
  evidence: results/film/anims/row
  hero: false
- id: dimension_as_arrival
  title: A dimension is how fast neighbours arrive
  hook: Double the houses and the walk grows by 2 on a street, by root 2 in a town, by cube root 2 in
    a tower.
  evidence: results/film/anims/walk
  hero: false
- id: droplet_closure
  title: The relational state tears
  hook: Carry only distances between pairs. Newton's law still works, until it does not, and the tear
    is visible.
  evidence: results/film/renders/lj_droplet/preview.png
  hero: true

theses:
- id: rows-read-chemistry
  question: A rule that only says "meet and vanish" runs down at half the textbook rate in two dimensions.
    Why, and can you see the reason in nothing but the distances between particles?
  number: 'about 9: by the end, the typical distance to the nearest partner of the other colour is nine
    times the typical distance to the nearest particle of your own colour (8.8, median over five runs,
    experiments/exp33_chemistry.py -> results/exp33_chemistry/summary.json, exponents::AB_d2.segregation_end_mean);
    stirred, it stays at 1.0 and the rate returns to the textbook''s'
  picture: 'the same 200,000 particles twice, side by side: on the left the two colours sort themselves
    into regions; on the right the colours are shuffled every few steps, no regions form, and nine times
    fewer particles are left'
  phenomena:
  - ab_segregation
  - ab_control
  - row_invariance
  - dimension_as_arrival
  stage: animatic
  episode: Rows read chemistry
  blocked_by: '(1) The claim. S6-S7 say the decay rate was predicted from rows. The same rows pipeline
    reads -0.93 on the stirred run and -0.87 on one colour, so it tracks whatever the decay is; a particle
    count gives the same exponent with no distances at all. What only distances give is the segregation
    ratio, which is 8.8 unstirred and 1.0 stirred. S5-S7 need rewriting around that number, and the animatic
    does not show it yet. (2) Vocabulary: "rows" and "a dimension read off the rows" are used in S6 and
    introduced nowhere; the episode needs the row and walk clips (30 s) up front, or episode 1 first.
    (3) Repo-speak: "registered" four times (S5, S6, S7, S10), "card" (S6), "seed" twice and "fourteen
    point eight" (S10) in the voice; P-numbers and a registered column on the S6 and S10 cards; "E33 P2"/"E33
    P3" on the counter and like clips. (4) Silence: takes total 162 s under 270 s of picture, so 108 s
    is silent; the worst is S1 at 25 s, then S7, S2, S9, S12. Re-cut to the takes instead of adding words.
    (5) S7 and S11 hold light-ground committed figures in a dark film; both need dark redraws. (6) Every
    tape shot draws clocks, a scale bar and the A/B counter on the particles; that needs a ruling that
    it is the style, or else the counter becomes its own insert. (7) Flat orthographic scatter with no
    camera or light; a lit version needs a styleframe ruling before any lane time. (8) No music bed, ducking,
    titles, chapters or thumbnail; the voice was a seeded random draw, not an audition. (9) Nothing ties
    a spoken number to its command and file: film/assemble.py checks only take length.'

question: '**Project Goal:** Build a highly efficient, multi-scale particle simulation framework inspired
  by [Particle Lenia](https://arxiv.org/abs/2301.01466). The system uses **Geometric Deep Learning** to
  learn the emergent dynamics of particle clusters at one scale and condense them into efficient "macro-particles"
  at a higher scale. This allows for massive simulations where "physics" is learned via reno'

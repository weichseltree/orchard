theses:
- id: look_then_paint
  question: Can a machine that only sees what is under its hand copy a picture it has to remember?
  number: the share of unseen many-coloured grids a policy copies exactly when it has to look, remember
    and paint (today 0 of 128 without memory; with one remembered glimpse the ceiling is every one of
    them)
  picture: the cursor leaving the source grid, a single remembered glimpse held behind it, and the answer
    frame filling in from memory cell by cell
  phenomena:
  - foveated_view
  - memory_makes_it_possible
  - learned_copy
  stage: thesis
  episode: Looking is moving
  blocked_by: 'gate G2 in MILESTONES.md: no policy has yet used the remembered glimpse at the 0.9 bar

question: Can a machine learn to solve ARC puzzles the way a person does at a screen, by looking around,
  picking a colour and clicking, when it only ever sees clearly what is close to its cursor?
status: active
stage: planted
gpu: torch
phenomena:
- id: editing_is_the_interface
  title: The whole puzzle is cells, and the only verb is click
  hook: 'The example grids, the empty answer frame, the ten colours and the submit button are all drawn
    as cells on one endless canvas. The agent has one cursor and one thing it can do: click a cell. Choosing
    a colour, painting, resizing, handing in: all of it is clicks.'
  evidence: results/grove/oracle_side5/layout.png
  hero: true
- id: foveated_view
  title: It never sees the board, only what is near its hand
  hook: Around the cursor the agent sees eight cells sharply. Further out it sees only averages, each
    ring twice as coarse as the last, until the far edge of the canvas is a blur of four numbers. To read
    a colour it has to go there. Looking is moving.
  evidence: results/grove/policy_side3/pyramid.png
  hero: true
- id: learned_copy
  title: Trained by imitation, it copies a square it has never seen
  hook: A network that watched a scripted teacher walks to the palette, picks the right colour, paints
    three by three and hands in. On grids it never saw in training it gets 124 of 128 exactly right, in
    about fifteen clicks.
  evidence: results/i13_teacher_order/BUILD.md
  hero: false
- id: reward_barrier
  title: Given only a score, it learns the small case and stalls at the next
  hook: Take the teacher away and pay only for a correct answer. The same design learns the two-by-two
    copy from nothing. At three by three it learns to read the colour and then does not press submit.
    That is where the work is.
  evidence: results/i15_perception_under_reward/BUILD.md
  hero: false
- id: memory_makes_it_possible
  title: One remembered glimpse makes the coloured copy solvable
  hook: 'Keep exactly one past view, unchanged, as it was seen. That is enough to copy a many-coloured
    grid from a distance. Keep a new view at every glance and it stops working: each trip to the palette
    overwrites the picture the agent went to fetch.'
  evidence: results/snapshot/BUILD.md
  hero: false
- id: random_play_finds_nothing
  title: Clicking at random never earns a point
  hook: Two hundred and fifty-six games of random clicking in the raw click language earn nothing at all;
    the same random play in a language of 'paint this cell this colour' scores in more than half of them.
    What the agent can say decides what it can find.
  evidence: results/aspace_measure/BUILD.md
  hero: false

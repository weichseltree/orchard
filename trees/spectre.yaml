kill: If the EP3 planet cannot be shown as a lit, moving, narrated 3 minutes by the second round, spectre supplies renderers to the studio and stops making episodes itself.
phenomena:
  - id: planet_from_scratch
    title: Heavy things go to the middle and nobody told them to
    hook: There is no rule in this simulation that says heavy things go to the middle. There are two forces and a clock, and this is what came out.
    evidence: results/m03_first_film/assembly-v6/ep03-assembly.mp4
    hero: true
  - id: surface_tension
    title: A world that measures like matter
    hook: That surface has a strength, the same property that lets insects stand on ponds. Our world measures 0.40. The published value is 0.42.
    evidence: deliverables/first-film.mp4
    hero: true
  - id: same_seed_one_number
    title: Same seed, same forces, one number different
    hook: The only difference between these three worlds is that one number.
    evidence: lanes/m03_first_film/episodes/ep03/shots.py

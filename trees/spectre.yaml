kill: 'The episode clause this criterion began with was enacted by ruling on 2026-09-12, not by failure:
  rendering and episodes left spectre (68239c4), which now supplies tapes and measured numbers only. Prune
  the tree from the slate if, by the end of round two, Planet from scratch made by the studio from these
  tapes has no style B animatic with measured narration that passes the 18-shot contact sheet, or if the
  studio needs a tape spectre cannot write inside its budget. The physics clause this criterion carried
  is spent: the final verdict (2026-09-12) fired neither chemistry check, drop-the-chemistry at 0.232
  against 0.5 and cooling-not-chemistry at 0.0494 against 0.05. Because the second sits on its line, no
  narration may say the unmixing CAUSED the core until saturation and a shared cooling driver are separated;
  if that bill is paid in cooling''s favour, the thesis is rewritten before any take is recorded. The
  flywheel question stays open on its own clock; no coarse model has yet taken a longer stable step than
  the fine engine, and no episode may claim one.'
potential: 9
notes: 'Paired with neuralese from 2026-09-16 (Manuel): both repositories are new and have to work together.
  This one is the physics, the fine simulator and the ladder of coarse models measured against it; neuralese
  is the cooperation protocol that runs on top and scores its nodes against a realised outcome. Neither
  supersedes the other. The directory was renamed spectre -> coarsen the same day; this tree keeps the
  name `spectre`, which is inside the bytes every bundle id hashes. Tapes are the stock-in-trade: video/tape/1
  is written by core/video/tape.py and einstruct and orchard both import it from this working tree, unpinned.
  The planet trio (chi 0, 6, 12) shares one frame clock: identical (step, t) for all 1,129 frames, so
  frame index scrubs them in step. Probes, not exhibits: opening-chi0/6/12 (114 frames, 1.2 dynamical
  times, the swelling of core_breathes), firststeps-chi0 and fine-chi0 (the lattice melt), adiabat-smoke
  (32,000 particles), v00-tape/T0.8 (12,288 particles in a periodic slab, 43,750 frames; the first film''s
  source, would need a frame window to bundle). The e10-mixture tapes are header and trailer only; their
  data was deleted. No stock sidecar exists on any declared still; each carries a render sidecar <stem>.json.
  No git remote configured for this checkout. The video pipeline (core/film, lanes/m03_first_film) left
  spectre at 68239c4; tag film-final (9721bf8) holds it whole (git archive film-final core/film lanes/m03_first_film).
  core/film/pacing.py stays only as a stub for einstruct''s sys.path import, to be deleted once einstruct
  carries its own copy. The tape format''s wish list moved to core/video/TAPE_WISHLIST.md. Every results
  path above survived the removal. The budget covers spectre''s own side only (harvests, verdict reruns);
  narration and render spend is the studio''s. The user-requested planet cutaway delivery was completed
  on 2026-09-14 from the existing M04 field arrays, at 018634d. Its mesh, four shared video-texture modes,
  local viewer and evidence are documented in lanes/m04_planet/exhibit/README.md. On 2026-09-15 (f5412e8)
  v2 replaced the sphere with the measured surface (a per-frame height field; fixed-topology mesh plus
  a vertex-radius stream under results/m04_planet/exhibit-v2/surface/seg*.bin). Its six verified HLS bundles
  live locally under results/m04_planet/exhibit-v2/hls/ (v1''s under exhibit-v1/hls/); index.json maps
  their IDs. None of these bundles has been published. The two flat clips above have source provenance
  sidecars; atlas modes are textures for the new cutaway consumer, not flat wall exhibits. The original
  pressure-check failures remain published.'

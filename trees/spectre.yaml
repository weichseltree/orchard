theses:
- id: planet-from-scratch
  question: Fill a ball held together by its own gravity with an even mix of heavy and light particles.
    Does the heavy kind find the middle on its own, and how would you know we did not put it there?
  number: 97 % heavy inside the middle fifth of the particles (r < 30) against 38 % outside, at 24 dynamical
    times, chi 12, while the whole ball stays at exactly 50 % in every frame
  picture: three balls from one starting arrangement, differing only in how much the two kinds dislike
    each other, sliced at the same moment; the middles read 53, 83 and 97 % heavy
  phenomena:
  - planet_from_scratch
  - same_seed_one_number
  stage: styleframe
  episode: Planet from scratch
  blocked_by: Rendering and episodes left spectre on 2026-09-12 (68239c4, ruling); the orchard studio
    makes this episode from spectre's tapes and spectre supplies the tapes and the measured numbers. The
    episode's code is at tag film-final (9721bf8), lanes/m03_first_film/episodes/ep03. v6 animatic rejected
    2026-09-11; the style B look is locked and the episode is redeclared as 18 shots (17 distinct pictures,
    11 moving cameras, variety check clean), but only 4 of them have plates (9 smoke plates, all of one
    tape frame), so the 18-shot contact sheet has never been rendered or ruled on (LAWS 15). The v6 narration
    was written for a collapsing cloud and this world is built as a ball, so the script needs a rewrite
    before new takes. The sweep's final verdict at 96 dynamical times (df1f3f3, results/m04_planet/sweep-verdict/VERDICT.md)
    converged at its last row on a 1.2 % margin, nothing degraded; by then the middles read 60, 97 and
    99 % heavy. The rewrite must respect two limits it recorded. Whether the unmixing or a shared cooling
    drives the core is not separable from this record (the control check sits at 0.0494 against 0.05 and
    its plain-language condition is met), and the chi 6 and 12 cores carry real angular structure through
    8-32 dynamical times, so a radial number there is a mean over domains and must say so.

notes: 'Donor tree, not an episode tree. Nothing on disk is a splat, still, clip or tape. Spike C (docs/milestones.md)
  has not run, so there is no captured room and no measured 6DoF budget. Every splat number from this
  tree is a prior until Spike C''s ADR lands; the repo keeps unmeasured numbers out of its docs (ADR 0006).
  The budget above is the Spike C estimate (one phone shoot, structure from motion, about three reconstruction
  attempts on an 8 GB card, compression, coverage analysis), not a measurement. Exists but deliberately
  not listed as artefacts: a playable WebXR chest room of draft proxies (apps/client, `pnpm dev`; desktop
  orbit fallback plus Enter VR; covered by apps/client/tests/play.spec.ts), 20 SVG wardmark glyphs (content/art/wardmarks/),
  and 25 synthesized voice lines (content/audio/vo/00-the-cellar/, Opus with provenance.json). The splat
  asset''s metadata already has a schema, SplatAssetSchema in packages/scene-schema/src/capture.ts (lods
  of srcUrl + splatCount, boundsM, coverage.radiusM, captureId, consentRef). Splat rooms are station-bound
  by design (docs/vision.md constraint 12): the viewer leans inside a measured radius and never walks.
  The grove''s XR entry already follows this repo''s rule. What is left worth lifting is apps/client/src/input/dwell.ts
  + input/raycast.ts (pointing with a 300 ms dwell, mouse and controller rays; only three and two branded
  string types) and xr/support.ts (a newer probe always wins over an older one). None of it uses eval
  or Function.'

[project]
name = "orchard"
version = "0.1.0"
description = "A fund and a studio for the weichseltree research repos: capital in, episodes out."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
orchard = "orchard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchard"]

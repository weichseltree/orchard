[project]
name = "orchard"
version = "0.1.0"
description = "A fund and a studio for the weichseltree research repos: capital in, episodes out."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.5.3",
    "matplotlib>=3.11.2",
    "orchard-tape",
    "orchard-score",
]

[project.scripts]
orchard = "orchard.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchard"]

# `video/tape/1` lives in packages/tape as its own distribution, so every other
# repo can depend on the one tagged release (tape-vX.Y.Z) instead of putting
# spectre's working tree on sys.path. Orchard takes it from the workspace.
# `video/tape/1` lives in packages/tape as its own distribution, so every other
# repo can depend on the one tagged release (tape-vX.Y.Z) instead of putting
# spectre's working tree on sys.path. Orchard takes it from the workspace.
# `orchard/score/1` (packages/score) follows the same path, so LogSwarm can
# pin the score schema by tag the same way (PACKAGES.md §2).
[tool.uv.workspace]
members = ["packages/tape", "packages/score"]

[tool.uv.sources]
orchard-tape = { workspace = true }
orchard-score = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/tape/tests", "packages/score/tests"]

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.26'
          python-version: '3.12'
          enable-cache: true
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Test Python packages and dashboard interactions
        run: uv run --frozen pytest -ra

  grove:
    name: Grove tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: grove
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned package manager
        run: npm install --global pnpm@10.29.2
      - name: Install locked grove dependencies
        run: pnpm install --frozen-lockfile
      - name: Test playback, controls and build helpers
        run: pnpm test
      - name: Test browser measurement helpers
        run: node --test scripts/quality-browser-support.test.mjs
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Build the public site and grove
        run: pnpm build
      - name: Enforce build size budgets
        run: pnpm quality:build
      - name: Install the browser for accessibility and interaction checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the synthetic demo on desktop and touch layouts
        run: pnpm quality:browser --out ../results/quality/demo.json
      - name: Check production headers and cold and warm asset loading
        run: pnpm quality:browser --dist dist --gzip --out ../results/quality/production.json
      - name: Inspect every Observatory room and its source-frame fixtures
        run: pnpm quality:world --out ../results/quality/world.json
      - name: Keep quality reports, including failed checks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grove-quality-${{ github.sha }}
          path: results/quality/*.json
          if-no-files-found: warn
          retention-days: 30

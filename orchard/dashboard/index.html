<!doctype html>
<meta charset="utf-8">
<title>orchard</title>
<style>
  :root { --bg:#0e1310; --panel:#161d18; --ink:#d9e2da; --dim:#8a978c; --leaf:#7fc97f; --warn:#e6b450; --bad:#e46c6c; }
  body { margin:0; padding:20px 24px; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  h1 { font-weight:600; font-size:20px; margin:0 0 4px; } h1 span { color:var(--dim); font-weight:400; }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:24px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
  .panel { background:var(--panel); border-radius:8px; padding:12px 14px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:3px 8px 3px 0; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; } td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:6px; background:#243026; border-radius:3px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--leaf); }
  .bar i.warn { background:var(--warn); } .bar i.bad { background:var(--bad); }
  .stage { color:var(--leaf); } .muted { color:var(--dim); }
  form.row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } input, select, button { background:#0e1310; color:var(--ink); border:1px solid #2a352c; border-radius:4px; padding:3px 6px; font:inherit; }
  button { cursor:pointer; } button.verdict { padding:1px 6px; font-size:12px; } button.ok { border-color:var(--leaf); } button.bad { border-color:var(--bad); }
  td.wrap { white-space:normal; max-width:420px; }
</style>
<h1>orchard <span>· the fund and the studio · weichseltree</span></h1>
<div class="muted" id="meta">loading…</div>
<h2>Portfolio</h2><div class="panel"><table id="trees"></table></div>
<div class="grid">
  <div><h2>Capital, last 30 days</h2><div class="panel"><table id="spend"></table></div></div>
  <div><h2>Quota and credit</h2><div class="panel" id="cards"></div></div>
  <div><h2>GPU queue wait by tier</h2><div class="panel"><table id="wait"></table></div></div>
  <div><h2>Running now</h2><div class="panel"><table id="running"></table></div></div>
</div>
<h2>Greenhouse · review queue</h2>
<div class="panel">
  <table id="reviews"></table>
  <form id="review-form" class="row">
    <input name="tree" placeholder="tree" required size="10"><input name="thesis" placeholder="thesis id" required size="18">
    <select name="kind"><option>styleframe</option><option>animatic</option><option>cut</option><option>still</option><option>master</option></select>
    <input name="title" placeholder="title" required size="28"><input name="url" placeholder="url (optional)" size="28">
    <button>submit for review</button>
  </form>
</div>
<div class="grid">
  <div><h2>Rulings</h2><div class="panel"><table id="rulings"></table></div></div>
  <div><h2>Directives</h2><div class="panel"><table id="directives"></table>
    <form id="directive-form" class="row"><input name="text" placeholder="a standing instruction every session reads" size="48" required><button>set</button></form></div></div>
  <div><h2>Hanging in the grove</h2><div class="panel"><table id="exhibits"></table></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const row = (cells, cls=[]) => '<tr>' + cells.map((c,i)=>`<td class="${cls[i]||''}">${c}</td>`).join('') + '</tr>';
const head = h => '<tr>' + h.map(x=>`<th>${x}</th>`).join('') + '</tr>';
async function main(){
  const [trees, led] = await Promise.all([fetch('/api/portfolio').then(r=>r.json()), fetch('/api/ledger').then(r=>r.json())]);
  const recent = Object.fromEntries(led.spend_recent.map(s=>[s.repo,s]));
  $('#meta').textContent = `${led.n_jobs} ledger records · expdash ${led.expdash_reachable?'reachable':'NOT reachable'} · video share ${(100*led.video_share.video_h/Math.max(1,led.video_share.total_h)).toFixed(0)}% of ${led.video_share.total_h.toFixed(0)} lane-hours`;
  trees.sort((a,b)=>(b.potential-a.potential)||a.name.localeCompare(b.name));
  $('#trees').innerHTML = head(['tree','status','stage','pot','theses','gpu h 30d','video h 30d','budget gpu h','question']) +
    trees.map(t=>{const s=recent[t.name]; const st=(t.theses.map(x=>x.stage).concat([t.stage])).sort((a,b)=>STAGES.indexOf(b)-STAGES.indexOf(a))[0];
      return row([esc(t.name),esc(t.status),`<span class="stage">${esc(st)}</span>`,t.potential||'',t.theses.length,(s?s.gpu_h:0).toFixed(1),(s?s.video_h:0).toFixed(1),t.budget.gpu_h||'<span class="muted">ask</span>',esc(t.question.slice(0,90))],['','','','num','num','num','num','num']);}).join('');
  $('#spend').innerHTML = head(['repo','gpu h','cpu h','exprun h','video h','jobs','failed','waited h']) +
    led.spend_recent.slice(0,14).map(s=>row([esc(s.repo),s.gpu_h.toFixed(1),s.cpu_h.toFixed(1),s.none_h.toFixed(1),s.video_h.toFixed(1),s.n,s.n_failed,s.wait_h.toFixed(0)],['','num','num','num','num','num','num','num'])).join('');
  $('#cards').innerHTML = led.cards.filter(c=>c.kind!=='disk').map(c=>{const p=Math.min(100,c.percent||0); const cls=p>90?'bad':p>70?'warn':'';
    return `<div style="margin:6px 0 10px"><div style="display:flex;justify-content:space-between"><span>${esc(c.label)}</span><span class="muted">${Number(c.used||0).toLocaleString()} / ${Number(c.limit||0).toLocaleString()} ${esc(c.unit||'')}</span></div><div class="bar"><i class="${cls}" style="width:${p}%"></i></div><div class="muted" style="font-size:12px">${esc(c.note||'')}</div></div>`;}).join('') || '<span class="muted">expdash not reachable</span>';
  $('#wait').innerHTML = head(['tier','n','median min','p90 h','max h']) + Object.entries(led.queue_wait).sort().map(([t,v])=>row([t,v.n,v.median_min.toFixed(0),v.p90_h.toFixed(1),v.max_h.toFixed(1)],['','num','num','num','num'])).join('');
  $('#running').innerHTML = head(['name','repo','box','lane','status','prio']) + (led.running.map(j=>row([esc(j.name),esc(j.repo),esc(j.box),j.lane,j.status,j.prio??''])).join('') || row(['<span class="muted">nothing on the lanes</span>']));
}
const STAGES=['scouted','planted','thesis','styleframe','animatic','greenlit','rendering','mastered','published','exhibited'];
const when = s => s ? new Date(s*1000).toLocaleString() : '';
async function post(url, body){ const r = await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); if(!r.ok){ alert((await r.json()).detail||r.statusText); } await greenhouse(); }
async function rule(id, verdict){ const note = verdict==='approved'||verdict==='greenlit' ? (prompt('note (optional)')??'') : (prompt('what must change?')??''); if(note===null) return; await post('/api/rule',{review_id:id,verdict,note}); }
async function greenhouse(){
  const g = await fetch('/api/greenhouse').then(r=>r.json());
  if(g.error){ $('#reviews').innerHTML = row([`<span class="muted">greenhouse unreachable: ${esc(g.error)}</span>`]); return; }
  const verdicts = it => it.status!=='open' ? `<span class="stage">${esc(it.status)}</span>` :
    ['approved','greenlit','changes','rejected'].map(v=>`<button class="verdict ${v==='changes'||v==='rejected'?'bad':'ok'}" onclick="rule(${it.id},'${v}')">${v}</button>`).join(' ');
  $('#reviews').innerHTML = head(['#','tree','thesis','kind','title','note','submitted','ruling']) +
    (g.review_items.map(it=>row([it.id,esc(it.tree),esc(it.thesis),esc(it.kind),it.url?`<a href="${esc(it.url)}" target="_blank">${esc(it.title)}</a>`:esc(it.title),esc(it.note),when(it.created_at),verdicts(it)],['num','','','','','wrap','muted',''])).join('') || row(['<span class="muted">nothing waiting for a ruling</span>']));
  $('#rulings').innerHTML = head(['when','review','verdict','note']) + (g.rulings.map(r=>row([when(r.at),'#'+r.review_id,`<span class="stage">${esc(r.verdict)}</span>`,esc(r.note)],['muted','num','','wrap'])).join('') || row(['<span class="muted">no rulings yet</span>']));
  $('#directives').innerHTML = head(['when','directive','']) + (g.directives.map(d=>row([when(d.at),d.active?esc(d.text):`<s class="muted">${esc(d.text)}</s>`,d.active?`<button class="verdict" onclick="post('/api/directive/${d.id}/retire',{})">retire</button>`:''],['muted','wrap',''])).join('') || row(['<span class="muted">no directives</span>']));
  $('#exhibits').innerHTML = head(['#','tree','kind','title','hung']) + (g.exhibits.map(e=>row([e.id,esc(e.tree),esc(e.kind),`<a href="${esc(e.url)}" target="_blank">${esc(e.title)}</a>`,when(e.hung_at)],['num','','','','muted'])).join('') || row(['<span class="muted">nothing hangs yet</span>']));
}
$('#review-form').addEventListener('submit', async ev => { ev.preventDefault(); const f = new FormData(ev.target); await post('/api/review', Object.fromEntries(f.entries())); ev.target.reset(); });
$('#directive-form').addEventListener('submit', async ev => { ev.preventDefault(); const f = new FormData(ev.target); await post('/api/directive', {text:f.get('text')}); ev.target.reset(); });
main().catch(e=>{$('#meta').textContent='error: '+e;});
greenhouse().catch(e=>{$('#reviews').innerHTML=row(['<span class="muted">greenhouse: '+esc(e)+'</span>']);});
</script>
